<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08777B"/>
      <stop offset="1" stop-color="#19A0A2"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65B3AE"/>
      <stop offset="1" stop-color="#08777B"/>
    </linearGradient>
  </defs>

  <!-- Circle -->
  <circle cx="512" cy="512" r="486" fill="#F8F6F1"/>
  <circle cx="512" cy="512" r="30" fill="#08777B" opacity="0"/>
  <circle cx="512" cy="512" r="476" fill="none" stroke="#08777B" stroke-width="30"/>

  <!-- Large calculator -->
  <rect x="188" y="270" width="405" height="500" rx="64" fill="#15383D"/>
  <rect x="216" y="300" width="349" height="132" rx="34"
        fill="#F8F6F1" stroke="#0D2E33" stroke-width="8"/>
  <rect x="250" y="340" width="76" height="21" rx="10.5" fill="#65A7A4"/>

  <!-- Calculator keys -->
  <g fill="#F8F6F1">
    <rect x="225" y="475" width="90" height="90" rx="23"/>
    <rect x="337" y="475" width="90" height="90" rx="23"/>
    <rect x="225" y="592" width="90" height="90" rx="23"/>
    <rect x="337" y="592" width="90" height="90" rx="23"/>
  </g>
  <rect x="448" y="535" width="108" height="147" rx="28" fill="url(#teal)"/>

  <!-- Operators -->
  <g stroke="#15383D" stroke-width="12" stroke-linecap="round">
    <path d="M250 520h40M270 500v40"/>
    <path d="M362 520h40"/>
    <path d="M250 610l40 40M290 610l-40 40"/>
    <path d="M362 637h40M382 617v40"/>
  </g>
  <circle cx="382" cy="617" r="7" fill="#15383D"/>
  <g stroke="#F8F6F1" stroke-width="12" stroke-linecap="round">
    <path d="M476 595h52M476 627h52"/>
  </g>

  <!-- Large financial chart -->
  <g fill="url(#bars)">
    <rect x="575" y="565" width="76" height="205" rx="16"/>
    <rect x="680" y="465" width="76" height="305" rx="16"/>
    <rect x="785" y="365" width="76" height="405" rx="16"/>
  </g>

  <!-- Growth line -->
  <path d="M545 515 L650 410 L705 455 L845 300"
        fill="none" stroke="url(#teal)" stroke-width="32"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M810 295 L870 277 L852 337 Z" fill="#19A0A2"/>

  <!-- Ground line -->
  <path d="M535 770 Q705 795 895 740"
        fill="none" stroke="#08777B" stroke-width="14"
        stroke-linecap="round"/>
</svg>